# 메디체크 코리아 — 1단계 시범 서버
#
# 기획서 8장이 "사이트는 둘, DB 는 하나"라고 정했다. 지금은 시범이라 이 앱이
# 제 SQLite 파일을 들고 있지만, 실제로는 협회 DB 를 같이 본다. 그래서 표 이름과
# 칸 이름을 협회 쪽 설계(6장)와 똑같이 맞춰 두었다 — 나중에 datasource 만 갈아 끼운다.

spring.application.name=medicheck

spring.datasource.url=jdbc:sqlite:${MEDICHECK_DB:data/medicheck.db}
spring.datasource.driver-class-name=org.sqlite.JDBC

# SQLite 는 쓰기 잠금이 파일 단위다. 커넥션을 여러 개 열면 SQLITE_BUSY 로 서로 막는다.
spring.datasource.hikari.maximum-pool-size=1

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=${MEDICHECK_PORT:8081}

# 정적 화면은 index.html 하나뿐이다. 나머지 경로는 SpaWebConfig 가 그리로 넘긴다.
#
# 소스 폴더를 먼저 본다. gradlew bootRun 은 build 폴더로 복사된 사본을 서빙하므로,
# 이 줄이 없으면 npm run watch 로 번들을 다시 만들어도 서버는 옛 파일을 계속 준다 —
# 새로고침해도 화면이 안 바뀌고, 왜 안 바뀌는지는 아무 데도 안 나온다.
# jar 로 띄우면 이 경로가 없으므로 스프링이 조용히 건너뛴다.
spring.web.resources.static-locations=file:./src/main/resources/static/,classpath:/static/
spring.web.resources.cache.period=0
spring.mvc.problemdetails.enabled=true
